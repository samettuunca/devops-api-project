name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t devops-api:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::246392208993:role/github-actions-devops-api-role
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag devops-api:${{ github.sha }} \
            246392208993.dkr.ecr.eu-west-1.amazonaws.com/devops-api:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            246392208993.dkr.ecr.eu-west-1.amazonaws.com/devops-api:${{ github.sha }}

      - name: Deploy to Terraform EC2 with SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=terraform-devops-api-ec2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 246392208993.dkr.ecr.eu-west-1.amazonaws.com",
              "docker pull 246392208993.dkr.ecr.eu-west-1.amazonaws.com/devops-api:${{ github.sha }}",
              "docker stop devops-api 2>/dev/null || true",
              "docker rm devops-api 2>/dev/null || true",
              "docker run -d --name devops-api --restart unless-stopped -p 8000:8000 246392208993.dkr.ecr.eu-west-1.amazonaws.com/devops-api:${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        run: |
          sleep 10

          aws ssm list-command-invocations \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --details